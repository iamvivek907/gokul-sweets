plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.jvm'
    id "org.jetbrains.kotlin.plugin.lombok" version '2.4.10'
}

dependencyManagement {
	imports {
		mavenBom "software.amazon.awssdk:bom:2.34.0"
	}
}

group = 'com.gokulsweets'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation('nl.martijndwars:web-push:5.1.2') { exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on' }
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.bitbucket.b_c:jose4j:0.9.6'
	implementation 'com.paytm.pg:paytm-checksum:1.2.1'
	implementation 'org.apache.poi:poi-ooxml:5.4.1'
	/*
     * Cloudflare R2
     *
     * Cloudflare R2 is S3 compatible.
     */
	implementation 'software.amazon.awssdk:s3'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Independent regression suite for additive enhancements; the legacy test task remains unchanged.
sourceSets {
	enhancementTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}
configurations {
	enhancementTestImplementation.extendsFrom testImplementation
	enhancementTestRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.register('enhancementTest', Test) {
	description = 'Runs storefront and ordering enhancement regressions.'
	group = 'verification'
	testClassesDirs = sourceSets.enhancementTest.output.classesDirs
	classpath = sourceSets.enhancementTest.runtimeClasspath
	useJUnitPlatform()
}
tasks.named('check') {
	dependsOn tasks.named('enhancementTest')
}

// Development-only tools; neither formatter nor parser enters the deployment runtime.
configurations {
    javaFormatting
    maintenanceVerification
}
dependencies {
    javaFormatting 'com.google.googlejavaformat:google-java-format:1.24.0:all-deps'
    maintenanceVerification 'com.github.javaparser:javaparser-core:3.27.1'
}

def maintainedJava = fileTree('src') { include '**/*.java' } + fileTree('tools') { include '**/*.java' }
tasks.register('formatJava', JavaExec) {
    group = 'formatting'
    description = 'Formats maintained Java sources with four-space AOSP Java style.'
    classpath = configurations.javaFormatting
    mainClass = 'com.google.googlejavaformat.java.Main'
    maxHeapSize = '256m'
    doFirst { args = ['--aosp', '--replace'] + maintainedJava.files.sort().collect { it.absolutePath } }
}
tasks.register('checkJavaFormat', JavaExec) {
    group = 'verification'
    description = 'Rejects Java formatting drift without rewriting files.'
    classpath = configurations.javaFormatting
    mainClass = 'com.google.googlejavaformat.java.Main'
    maxHeapSize = '256m'
    doFirst { args = ['--aosp', '--dry-run', '--set-exit-if-changed'] + maintainedJava.files.sort().collect { it.absolutePath } }
}
tasks.named('check') { dependsOn tasks.named('checkJavaFormat') }

tasks.register('compileMaintenanceVerification', JavaCompile) {
    source = fileTree('tools') { include '**/*.java' }
    classpath = configurations.maintenanceVerification
    destinationDirectory = layout.buildDirectory.dir('maintenance-verification')
    options.release = 21
}
tasks.register('verifyBehaviorPreservation', JavaExec) {
    group = 'verification'
    description = 'Compares this maintenance refactor with an explicit base Git revision.'
    dependsOn tasks.named('compileMaintenanceVerification')
    classpath = files(layout.buildDirectory.dir('maintenance-verification')) + configurations.maintenanceVerification
    mainClass = 'BehaviorPreservationCheck'
    maxHeapSize = '256m'
    doFirst {
        if (!project.hasProperty('maintenanceBaseRevision')) {
            throw new GradleException('Supply -PmaintenanceBaseRevision=<Git revision> for this one-time maintenance comparison.')
        }
        args = [rootProject.projectDir.parentFile.absolutePath, project.property('maintenanceBaseRevision').toString()]
    }
}

tasks.register('checkMethodTimingCoverage', JavaExec) {
    group = 'verification'
    description = 'Enforces JavaDoc and timing coverage for explicitly declared backend methods.'
    dependsOn tasks.named('compileMaintenanceVerification')
    classpath = files(layout.buildDirectory.dir('maintenance-verification')) + configurations.maintenanceVerification
    mainClass = 'MethodTimingCoverageCheck'
    maxHeapSize = '256m'
    args = [file('src/main/java').absolutePath]
}
tasks.named('check') { dependsOn tasks.named('checkMethodTimingCoverage') }
