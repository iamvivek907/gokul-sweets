spring.application.name=restaurant-backend

# PostgreSQL
spring.datasource.url=${DATABASE_URL}
  #${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
  #${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
  #${DATABASE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true

# Server
server.port=${PORT:8080}

# Actuator
management.endpoints.web.exposure.include=health,info

payment.pending-expiry-minutes=15
checkout.reservation-expiry-minutes=15
checkout.reservation-expiry-check-interval-ms=60000
payment.refund-check-interval-ms=60000


payment.expiry-check-interval-ms=60000

# =========================================================
# ORDER PREPARATION WINDOWS
# =========================================================

gokul.orders.preparation.normal-lead-minutes=60
gokul.orders.preparation.priority-lead-minutes=30
gokul.orders.preparation.admin-override-lead-minutes=60


# Add these values to src/main/resources/application.properties.
# Keep enforcement disabled until inventory policies and daily
# allocations have been configured for live products.

inventory.enforcement-enabled=true
inventory.temporary-hold-minutes=15
inventory.default-booking-horizon-days=14
inventory.expiry-batch-size=100
inventory.hold-expiry-check-milliseconds=30000
inventory.business-zone=Asia/Kolkata


# Safe rollout: keep disabled until the late-pickup/no-show timings are approved.
order.pickup-lifecycle.automatic-expiry-enabled=false

# READY_FOR_PICKUP -> PICKUP_WINDOW_EXPIRED after pickup end + this grace.
order.pickup-lifecycle.pickup-expiry-grace-minutes=30

# PICKUP_WINDOW_EXPIRED -> NO_SHOW after pickup end + this duration.
order.pickup-lifecycle.no-show-after-minutes=240

order.pickup-lifecycle.batch-size=100
order.pickup-lifecycle.check-milliseconds=60000

# Keep disabled until rules are reviewed in the admin portal.
inventory.automation.scheduler-enabled=true

# Maximum date range accepted by one generation run.
inventory.automation.maximum-run-days=60

# Audit identity used for automatically approved guaranteed allocations.
inventory.automation.system-actor=SYSTEM_INVENTORY_AUTOMATION

# Daily generation time in Asia/Kolkata.
inventory.automation.cron=0 15 1 * * *

# Provider selection
payment.default-provider=${PAYMENT_DEFAULT_PROVIDER:PHONEPE}
payment.enabled-providers=${PAYMENT_ENABLED_PROVIDERS:RAZORPAY,PAYTM,PHONEPE}

