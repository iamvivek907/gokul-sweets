spring.application.name=restaurant-backend

# PostgreSQL
spring.datasource.url=${DATABASE_URL}
  #${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
  #${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
  #${DATABASE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true

# Server
server.port=${PORT:8080}

# Actuator
management.endpoints.web.exposure.include=health,info

payment.pending-expiry-minutes=15
checkout.reservation-expiry-minutes=15
checkout.reservation-expiry-check-interval-ms=60000
payment.refund-check-interval-ms=60000


payment.expiry-check-interval-ms=60000

# =========================================================
# ORDER PREPARATION WINDOWS
# =========================================================

gokul.orders.preparation.normal-lead-minutes=60
gokul.orders.preparation.priority-lead-minutes=30
gokul.orders.preparation.admin-override-lead-minutes=60


# Add these values to src/main/resources/application.properties.
# Keep enforcement disabled until inventory policies and daily
# allocations have been configured for live products.

inventory.enforcement-enabled=true
inventory.temporary-hold-minutes=15
inventory.default-booking-horizon-days=14
inventory.expiry-batch-size=100
inventory.hold-expiry-check-milliseconds=30000


# Safe rollout: keep disabled until the late-pickup/no-show timings are approved.
order.pickup-lifecycle.automatic-expiry-enabled=false

# READY_FOR_PICKUP -> PICKUP_WINDOW_EXPIRED after pickup end + this grace.
order.pickup-lifecycle.pickup-expiry-grace-minutes=30

# PICKUP_WINDOW_EXPIRED -> NO_SHOW after pickup end + this duration.
order.pickup-lifecycle.no-show-after-minutes=240

order.pickup-lifecycle.batch-size=100
order.pickup-lifecycle.check-milliseconds=60000

# Keep disabled until rules are reviewed in the admin portal.
inventory.automation.scheduler-enabled=true

# Maximum date range accepted by one generation run.
inventory.automation.maximum-run-days=60

# Audit identity used for automatically approved guaranteed allocations.
inventory.automation.system-actor=SYSTEM_INVENTORY_AUTOMATION

# Daily generation time in Asia/Kolkata.
inventory.automation.cron=0 15 1 * * *

# Provider selection
payment.default-provider=${PAYMENT_DEFAULT_PROVIDER:PHONEPE}
payment.enabled-providers=${PAYMENT_ENABLED_PROVIDERS:RAZORPAY,PAYTM,PHONEPE}

# Razorpay - server-side values only
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.base-url=${RAZORPAY_BASE_URL:https://api.razorpay.com}
razorpay.merchant-name=${RAZORPAY_MERCHANT_NAME:Gokul Sweets}
razorpay.theme-color=${RAZORPAY_THEME_COLOR:#7a1625}
razorpay.connect-timeout-seconds=${RAZORPAY_CONNECT_TIMEOUT_SECONDS:10}
razorpay.request-timeout-seconds=${RAZORPAY_REQUEST_TIMEOUT_SECONDS:20}

# Provider credentials must come from environment variables; never commit fallback credentials.
paytm.environment=${PAYTM_ENVIRONMENT:STAGING}
paytm.mid=${PAYTM_MID:}
paytm.merchant-key=${PAYTM_MERCHANT_KEY:}
paytm.website-name=${PAYTM_WEBSITE_NAME:WEBSTAGING}
paytm.base-url=${PAYTM_BASE_URL:https://securestage.paytmpayments.com}
paytm.callback-url=${PAYTM_CALLBACK_URL:}


# =========================================================
# PhonePe Standard Checkout V2
# =========================================================

phonepe.client-id=${PHONEPE_CLIENT_ID:}
phonepe.client-secret=${PHONEPE_CLIENT_SECRET:}
phonepe.client-version=${PHONEPE_CLIENT_VERSION:1}

# Sandbox
phonepe.base-url=${PHONEPE_BASE_URL:https://api-preprod.phonepe.com/apis/pg-sandbox}
phonepe.authorization-base-url=${PHONEPE_AUTHORIZATION_BASE_URL:https://api-preprod.phonepe.com/apis/pg-sandbox}

phonepe.authorization-path=${PHONEPE_AUTHORIZATION_PATH:/v1/oauth/token}
phonepe.create-payment-path=${PHONEPE_CREATE_PAYMENT_PATH:/checkout/v2/pay}
phonepe.order-status-path-template=${PHONEPE_ORDER_STATUS_PATH_TEMPLATE:/checkout/v2/order/{merchantOrderId}/status}

# Browser redirect base: /payment/{orderNumber} is appended by PhonePePaymentProvider.
phonepe.redirect-url=${PHONEPE_REDIRECT_URL:}

# Server-to-server webhook: point at the matching backend environment.
phonepe.webhook-url=${PHONEPE_WEBHOOK_URL:}

# HMAC webhook credentials
phonepe.webhook-checksum-key-id=${PHONEPE_WEBHOOK_CHECKSUM_KEY_ID:}
phonepe.webhook-checksum-secret=${PHONEPE_WEBHOOK_CHECKSUM_SECRET:}

phonepe.connect-timeout-seconds=${PHONEPE_CONNECT_TIMEOUT_SECONDS:10}
phonepe.request-timeout-seconds=${PHONEPE_REQUEST_TIMEOUT_SECONDS:20}
phonepe.token-expiry-safety-seconds=${PHONEPE_TOKEN_EXPIRY_SAFETY_SECONDS:30}


# Other secrets
gokul.print-agent.api-key=${PRINT_AGENT_API_KEY:}

# CORS
gokul.web.allowed-origins=${GOKUL_ALLOWED_ORIGINS:http://localhost:3000}
# Optional exact DEV/PROD storefront CORS policy. OFF retains the existing
# explicit allowlist; ON uses GOKUL_DEPLOYMENT_ENVIRONMENT (DEV or PROD) and
# rejects a conflicting GOKUL_ALLOWED_ORIGINS rather than widening access.
# The public API hostname is the request destination, not a browser origin.
gokul.web.environment-cors-enabled=${GOKUL_ENVIRONMENT_CORS_ENABLED:false}

# ============================================================
# CLOUDFLARE R2
# Credentials are environment-only. Rotate any keys previously committed in git history.
# ============================================================

cloudflare.r2.account-id=${R2_ACCOUNT_ID:}
  #${R2_ACCOUNT_ID}

cloudflare.r2.access-key-id=${R2_ACCESS_KEY_ID:}
  #${R2_ACCESS_KEY_ID}
cloudflare.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
  #${R2_SECRET_ACCESS_KEY}

cloudflare.r2.bucket-name=${R2_BUCKET_NAME:gokul-sweets-images}

cloudflare.r2.public-url=${R2_PUBLIC_URL:https://pub-1486d596635f4a65aa86b4afd04bec85.r2.dev}

# ============================================================
# MULTIPART / IMAGE UPLOAD
# ============================================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Additive storefront switches. Every new switch defaults OFF. Set the matching
# environment variable explicitly for a controlled DEV/production rollout.
# These switches never disable inventory.enforcement-enabled or its scheduler.
# Validated final cart availability and additional pickup preparation/window rules.
gokul.features.smart-availability=${GOKUL_FEATURES_SMART_AVAILABILITY:false}
# New pickup selector; effective only when smart-availability is also enabled.
gokul.features.smart-pickup-selection=${GOKUL_FEATURES_SMART_PICKUP_SELECTION:false}
# Rolling automation horizon and stock refresh; review branch policies first.
gokul.features.inventory-automation-v2=${GOKUL_FEATURES_INVENTORY_AUTOMATION_V2:false}
# Enhanced customer homepage; OFF uses the existing homepage.
gokul.features.customer-home-v2=${GOKUL_FEATURES_CUSTOMER_HOME_V2:false}
# Scheduled campaign rendering; also requires customer-home-v2.
gokul.features.homepage-campaigns=${GOKUL_FEATURES_HOMEPAGE_CAMPAIGNS:false}
# Inclusive maximum advance ordering horizon in days; validated in [1,60].
gokul.features.future-ordering-days=${GOKUL_FEATURES_FUTURE_ORDERING_DAYS:30}

# Rollout switch for correcting legacy entity timestamps to Asia/Kolkata.
# Keep enabled for dev; disable only during a controlled historical-data investigation.
gokul.features.ist-time-fix-enabled=${GOKUL_IST_TIME_FIX_ENABLED:true}

# SCRUM-16 rollout: OFF preserves existing deployment behaviour. When ON, reject
# startup if the declared DEV/PROD storefront, CORS, payment return/webhook,
# backend origin, storage bucket or database URL contradict one another.
gokul.environment-isolation.enabled=${GOKUL_ENVIRONMENT_ISOLATION_ENABLED:false}
# Required when isolation is ON: DEV or PROD; never infer from hostnames.
gokul.environment-isolation.environment=${GOKUL_DEPLOYMENT_ENVIRONMENT:}
# Public origin of this backend, e.g. https://api-dev.example.in (no path).
gokul.environment-isolation.api-origin=${GOKUL_PUBLIC_API_ORIGIN:}
