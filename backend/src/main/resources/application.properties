spring.application.name=restaurant-backend

# PostgreSQL
spring.datasource.url=${DATABASE_URL}
  #${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
  #${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
  #${DATABASE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true

# Server
server.port=${PORT:8080}

# Actuator
management.endpoints.web.exposure.include=health,info

payment.pending-expiry-minutes=15
checkout.reservation-expiry-minutes=15
checkout.reservation-expiry-check-interval-ms=60000
payment.refund-check-interval-ms=60000


payment.expiry-check-interval-ms=60000

# =========================================================
# ORDER PREPARATION WINDOWS
# =========================================================

gokul.orders.preparation.normal-lead-minutes=60
gokul.orders.preparation.priority-lead-minutes=30
gokul.orders.preparation.admin-override-lead-minutes=60
gokul.orders.preparation.delivery-lead-minutes=60


# Add these values to src/main/resources/application.properties.
# Keep enforcement disabled until inventory policies and daily
# allocations have been configured for live products.

inventory.enforcement-enabled=true
inventory.temporary-hold-minutes=15
inventory.default-booking-horizon-days=14
inventory.expiry-batch-size=100
inventory.hold-expiry-check-milliseconds=30000


# Safe rollout: keep disabled until the late-pickup/no-show timings are approved.
order.pickup-lifecycle.automatic-expiry-enabled=false

# READY_FOR_PICKUP -> PICKUP_WINDOW_EXPIRED after pickup end + this grace.
order.pickup-lifecycle.pickup-expiry-grace-minutes=30

# PICKUP_WINDOW_EXPIRED -> NO_SHOW after pickup end + this duration.
order.pickup-lifecycle.no-show-after-minutes=240

order.pickup-lifecycle.batch-size=100
order.pickup-lifecycle.check-milliseconds=60000

# Keep disabled until rules are reviewed in the admin portal.
inventory.automation.scheduler-enabled=true

# Maximum date range accepted by one generation run.
inventory.automation.maximum-run-days=60

# Audit identity used for automatically approved guaranteed allocations.
inventory.automation.system-actor=SYSTEM_INVENTORY_AUTOMATION

# Daily generation time in Asia/Kolkata.
inventory.automation.cron=0 15 1 * * *

# Provider selection
payment.default-provider=${PAYMENT_DEFAULT_PROVIDER:PHONEPE}
payment.enabled-providers=${PAYMENT_ENABLED_PROVIDERS:RAZORPAY,PAYTM,PHONEPE}

# Razorpay - server-side values only
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.base-url=${RAZORPAY_BASE_URL:https://api.razorpay.com}
razorpay.merchant-name=${RAZORPAY_MERCHANT_NAME:Gokul Sweets}
razorpay.theme-color=${RAZORPAY_THEME_COLOR:#7a1625}
razorpay.connect-timeout-seconds=${RAZORPAY_CONNECT_TIMEOUT_SECONDS:10}
razorpay.request-timeout-seconds=${RAZORPAY_REQUEST_TIMEOUT_SECONDS:20}

# Provider credentials must come from environment variables; never commit fallback credentials.
paytm.environment=${PAYTM_ENVIRONMENT:STAGING}
paytm.mid=${PAYTM_MID:}
paytm.merchant-key=${PAYTM_MERCHANT_KEY:}
paytm.website-name=${PAYTM_WEBSITE_NAME:WEBSTAGING}
paytm.base-url=${PAYTM_BASE_URL:https://securestage.paytmpayments.com}
paytm.callback-url=${PAYTM_CALLBACK_URL:}


# =========================================================
# PhonePe Standard Checkout V2
# =========================================================

phonepe.client-id=${PHONEPE_CLIENT_ID:}
phonepe.client-secret=${PHONEPE_CLIENT_SECRET:}
phonepe.client-version=${PHONEPE_CLIENT_VERSION:1}

# Sandbox
phonepe.base-url=${PHONEPE_BASE_URL:https://api-preprod.phonepe.com/apis/pg-sandbox}
phonepe.authorization-base-url=${PHONEPE_AUTHORIZATION_BASE_URL:https://api-preprod.phonepe.com/apis/pg-sandbox}

phonepe.authorization-path=${PHONEPE_AUTHORIZATION_PATH:/v1/oauth/token}
phonepe.create-payment-path=${PHONEPE_CREATE_PAYMENT_PATH:/checkout/v2/pay}
phonepe.order-status-path-template=${PHONEPE_ORDER_STATUS_PATH_TEMPLATE:/checkout/v2/order/{merchantOrderId}/status}

# Browser redirect base: /payment/{orderNumber} is appended by PhonePePaymentProvider.
phonepe.redirect-url=${PHONEPE_REDIRECT_URL:}

# Server-to-server webhook: point at the matching backend environment.
phonepe.webhook-url=${PHONEPE_WEBHOOK_URL:}

# HMAC webhook credentials
phonepe.webhook-checksum-key-id=${PHONEPE_WEBHOOK_CHECKSUM_KEY_ID:}
phonepe.webhook-checksum-secret=${PHONEPE_WEBHOOK_CHECKSUM_SECRET:}

phonepe.connect-timeout-seconds=${PHONEPE_CONNECT_TIMEOUT_SECONDS:10}
phonepe.request-timeout-seconds=${PHONEPE_REQUEST_TIMEOUT_SECONDS:20}
phonepe.token-expiry-safety-seconds=${PHONEPE_TOKEN_EXPIRY_SAFETY_SECONDS:30}


# Other secrets
gokul.print-agent.api-key=${PRINT_AGENT_API_KEY:}

# CORS
gokul.web.allowed-origins=${GOKUL_ALLOWED_ORIGINS:http://localhost:3000}
# Optional exact DEV/PROD storefront CORS policy. OFF retains the existing
# explicit allowlist; ON uses GOKUL_DEPLOYMENT_ENVIRONMENT (DEV or PROD) and
# rejects a conflicting GOKUL_ALLOWED_ORIGINS rather than widening access.
# The public API hostname is the request destination, not a browser origin.
gokul.web.environment-cors-enabled=${GOKUL_ENVIRONMENT_CORS_ENABLED:false}

# ============================================================
# CLOUDFLARE R2
# Credentials are environment-only. Rotate any keys previously committed in git history.
# ============================================================

cloudflare.r2.account-id=${R2_ACCOUNT_ID:}
  #${R2_ACCOUNT_ID}

cloudflare.r2.access-key-id=${R2_ACCESS_KEY_ID:}
  #${R2_ACCESS_KEY_ID}
cloudflare.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
  #${R2_SECRET_ACCESS_KEY}

cloudflare.r2.bucket-name=${R2_BUCKET_NAME:gokul-sweets-images}

cloudflare.r2.public-url=${R2_PUBLIC_URL:https://pub-1486d596635f4a65aa86b4afd04bec85.r2.dev}

# ============================================================
# MULTIPART / IMAGE UPLOAD
# ============================================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Additive storefront switches. Every new switch defaults OFF. Set the matching
# environment variable explicitly for a controlled DEV/production rollout.
# These switches never disable inventory.enforcement-enabled or its scheduler.
# Validated final cart availability and additional pickup preparation/window rules.
gokul.features.smart-availability=${GOKUL_FEATURES_SMART_AVAILABILITY:false}
# New pickup selector; effective only when smart-availability is also enabled.
gokul.features.smart-pickup-selection=${GOKUL_FEATURES_SMART_PICKUP_SELECTION:false}
# Rolling automation horizon and stock refresh; review branch policies first.
gokul.features.inventory-automation-v2=${GOKUL_FEATURES_INVENTORY_AUTOMATION_V2:false}
# Enhanced customer homepage; OFF uses the existing homepage.
gokul.features.customer-home-v2=${GOKUL_FEATURES_CUSTOMER_HOME_V2:false}
# Scheduled campaign rendering; also requires customer-home-v2.
gokul.features.homepage-campaigns=${GOKUL_FEATURES_HOMEPAGE_CAMPAIGNS:false}
# SCRUM-18: OFF keeps the existing page layouts; ON shows selected pickup context
# across browsing and checkout. This display never overrides backend order data.
gokul.features.persistent-pickup-context=${GOKUL_FEATURES_PERSISTENT_PICKUP_CONTEXT:false}
# SCRUM-19: OFF preserves existing branch/date controls. ON previews every cart
# line against the proposed branch/date before any local selection is changed.
# Pickup remains the only supported mode; delivery address changes are not offered.
gokul.features.cart-switch-preview=${GOKUL_FEATURES_CART_SWITCH_PREVIEW:false}
# SCRUM-93: choose a branch in place and show per-item cart conflicts after switching.
# Requires PERSISTENT_PICKUP_CONTEXT and CART_SWITCH_PREVIEW; OFF keeps existing navigation.
gokul.features.in-place-branch-switch=${GOKUL_FEATURES_IN_PLACE_BRANCH_SWITCH:false}
# SCRUM-20: OFF retains the existing atomic slot and stock checks. ON (effective
# only with SMART_AVAILABILITY) also checks the selected slot against the whole
# cart immediately before commitment. Preview is never a stock reservation.
gokul.features.authoritative-pickup-commitment=${GOKUL_FEATURES_AUTHORITATIVE_PICKUP_COMMITMENT:false}
# SCRUM-21: OFF keeps legacy checkout. ON requires customer acceptance of a fresh
# server-priced quote before any new hold or pending checkout edit.
gokul.features.accepted-checkout-quote=${GOKUL_FEATURES_ACCEPTED_CHECKOUT_QUOTE:false}
# SCRUM-22: OFF preserves existing payment lifecycle. ON treats a success received
# after either IST deadline as a late payment and sends it to refund reconciliation;
# also checks signed Paytm status identity and amount before confirming an order.
gokul.features.payment-reconciliation-v2=${GOKUL_FEATURES_PAYMENT_RECONCILIATION_V2:false}
# SCRUM-23: OFF keeps existing order detail and admin actions. ON allows staff
# to report a revised readiness estimate and exposes it with branch support.
gokul.features.truthful-order-tracking=${GOKUL_FEATURES_TRUTHFUL_ORDER_TRACKING:false}
# SCRUM-92: reconcile a browser's matching pending cart after the backend confirms PAID.
# OFF leaves the existing payment return behavior; never clear a different cart.
gokul.features.paid-cart-recovery=${GOKUL_FEATURES_PAID_CART_RECOVERY:false}
# SCRUM-98: OFF keeps existing payment refresh timing. ON reduces provider checks,
# pauses in inactive/offline tabs and backs off after temporary rate-limit errors.
gokul.features.payment-polling-v2=${GOKUL_FEATURES_PAYMENT_POLLING_V2:false}
# SCRUM-25: OFF preserves the existing home entrance. ON shows a fast,
# media-independent first-visit choice; returning visitors with a saved branch
# or a choice in this tab go straight to home. No login or location required.
gokul.features.pre-home-intent-gateway=${GOKUL_FEATURES_PRE_HOME_INTENT_GATEWAY:false}
# SCRUM-26: OFF retains the current menu/product/cart presentation. ON clarifies
# per-shop prices, piece/weight units, date availability and the pre-quote cart
# estimate. Backend pickup/stock/price validation remains authoritative.
gokul.features.contextual-storefront-v2=${GOKUL_FEATURES_CONTEXTUAL_STOREFRONT_V2:false}
# SCRUM-27: owner MENU_MANAGE. Depends on homepage-campaigns; OFF retains the
# legacy campaign editor. ON serves versioned published snapshots, allowing
# safe draft edits and rollback; R2 media referenced by history is retained.
gokul.features.controlled-campaign-publishing=${GOKUL_FEATURES_CONTROLLED_CAMPAIGN_PUBLISHING:false}
# SCRUM-28: owner storefront UX. OFF retains current ordering UI. ON adds
# keyboard dialog handling, mobile action placement, reduced motion, offline
# recovery and sampled anonymous performance metrics. No checkout bypass.
gokul.features.accessible-ordering-v2=${GOKUL_FEATURES_ACCESSIBLE_ORDERING_V2:false}
# SCRUM-95: presentation only; effective with smart pickup, commitment, cart switch, quote, accessibility and payment polling ON. Default OFF.
gokul.features.checkout-experience-v2=${GOKUL_FEATURES_CHECKOUT_EXPERIENCE_V2:false}
# SCRUM-36: OFF. Do not enable until verified SMS delivery, abuse limits and
# customer-owned session endpoints are implemented and validated in DEV.
gokul.features.customer-otp-identity=${GOKUL_FEATURES_CUSTOMER_OTP_IDENTITY:false}
# SCRUM-49: owner privacy. OFF hides customer consent controls. ON requires
# verified identity, environment isolation/CORS and a legally reviewed policy version.
# Optional messaging/analytics remain disabled unless their own send paths consult
# the current ledger decision. Guest pickup and transactional contact are independent.
gokul.features.customer-consent-controls=${GOKUL_FEATURES_CUSTOMER_CONSENT_CONTROLS:false}
# SCRUM-29: owner delivery preview. Requires reviewed privacy controls and verified
# identity flags; OFF until SCRUM-49 QA and SCRUM-30 server-side zone rules pass.
# This check does not offer delivery checkout or record precise coordinates.
gokul.features.delivery-locality-check=${GOKUL_FEATURES_DELIVERY_LOCALITY_CHECK:false}
# SCRUM-30: BRANCH_MANAGE owner. OFF returns 404 for configuration and quote.
# Depends on SCRUM-29/49 QA and delivery reservation capacity before activation.
gokul.features.delivery-zones=${GOKUL_FEATURES_DELIVERY_ZONES:false}
# SCRUM-30: BRANCH_MANAGE owner. OFF hides rider windows and address quote.
# Requires delivery-zones and its privacy/identity prerequisites. Reservation
# must be attached to a delivery order lifecycle before offering checkout.
gokul.features.delivery-capacity=${GOKUL_FEATURES_DELIVERY_CAPACITY:false}
# SCRUM-30: BRANCH_MANAGE owner reviews address polygons. OFF keeps the
# provisional locality/PIN preview. ON requires a customer pin inside a reviewed
# boundary to show provisional windows; no coordinates are stored or logged.
gokul.features.delivery-address-boundaries=${GOKUL_FEATURES_DELIVERY_ADDRESS_BOUNDARIES:false}
# SCRUM-30: backend ordering owner. OFF forbids new rider holds; cleanup of
# existing holds runs even after OFF to avoid stranded capacity. Customer
# checkout also requires the separate delivery-checkout flag and DEV QA.
gokul.features.delivery-rider-holds=${GOKUL_FEATURES_DELIVERY_RIDER_HOLDS:false}
gokul.features.delivery-accepted-quote=${GOKUL_FEATURES_DELIVERY_ACCEPTED_QUOTE:false}
# SCRUM-30: backend ordering owner. OFF keeps customer delivery order creation hidden.
# Requires accepted quotes, reviewed address boundaries, live rider capacity, inventory
# reservation and payment expiry/commit safeguards. Activate only after DEV QA.
gokul.features.delivery-checkout=${GOKUL_FEATURES_DELIVERY_CHECKOUT:false}
gokul.consent.policy-version=${GOKUL_CONSENT_POLICY_VERSION:}
# Server authkey is never exposed to the browser. Keep empty until MSG91 is configured.
gokul.msg91.server-authkey=${GOKUL_MSG91_SERVER_AUTHKEY:}
gokul.identity.rate-limit-key=${GOKUL_IDENTITY_RATE_LIMIT_KEY:}
# Comma-separated CIDRs of reverse proxies that overwrite X-Forwarded-For/Proto.
# Empty trusts no forwarding headers; only direct HTTPS can exchange identity.
gokul.identity.trusted-proxy-cidrs=${GOKUL_IDENTITY_TRUSTED_PROXY_CIDRS:}
# Only set after MSG91 dashboard send/resend/cooldown/expiry controls and DEV behavior are evidenced.
gokul.identity.provider-abuse-controls-verified=${GOKUL_IDENTITY_PROVIDER_ABUSE_CONTROLS_VERIFIED:false}
# Separately roll out legacy order/payment route authorization after DEV payment-return smoke.
gokul.identity.protect-legacy-routes=${GOKUL_IDENTITY_PROTECT_LEGACY_ROUTES:false}
# Owner-selected policy. OFF retains prior-session-plus-OTP order continuity.
gokul.identity.phone-only-order-recovery=${GOKUL_IDENTITY_PHONE_ONLY_ORDER_RECOVERY:false}
# Set a long random secret before enabling the quote toggle; quotes expire after 5 minutes.
checkout.quote-signing-key=${GOKUL_CHECKOUT_QUOTE_SIGNING_KEY:}
# Inclusive maximum advance ordering horizon in days; validated in [1,60].
gokul.features.future-ordering-days=${GOKUL_FEATURES_FUTURE_ORDERING_DAYS:30}

# Rollout switch for correcting legacy entity timestamps to Asia/Kolkata.
# Keep enabled for dev; disable only during a controlled historical-data investigation.
gokul.features.ist-time-fix-enabled=${GOKUL_IST_TIME_FIX_ENABLED:true}

# SCRUM-16 rollout: OFF preserves existing deployment behaviour. When ON, reject
# startup if the declared DEV/PROD storefront, CORS, payment return/webhook,
# backend origin, storage bucket or database URL contradict one another.
gokul.environment-isolation.enabled=${GOKUL_ENVIRONMENT_ISOLATION_ENABLED:false}
# Required when isolation is ON: DEV or PROD; never infer from hostnames.
gokul.environment-isolation.environment=${GOKUL_DEPLOYMENT_ENVIRONMENT:}
# Public origin of this backend, e.g. https://api-dev.example.in (no path).
gokul.environment-isolation.api-origin=${GOKUL_PUBLIC_API_ORIGIN:}

# SCRUM-108: enable with matching cookie-based frontend and STAFF_MFA_ENCRYPTION_KEY.
gokul.features.secure-staff-sessions=${GOKUL_FEATURES_SECURE_STAFF_SESSIONS:false}
staff.mfa.encryption-key=${STAFF_MFA_ENCRYPTION_KEY:}

# SCRUM-31 finance-owned cost model; activate only with reviewed nonzero inputs/version.
gokul.features.delivery-economics=${GOKUL_FEATURES_DELIVERY_ECONOMICS:false}
delivery.economics.version=${DELIVERY_ECONOMICS_VERSION:}
delivery.economics.cost-valid-until=${DELIVERY_ECONOMICS_COST_VALID_UNTIL:}
delivery.economics.food-cost-rate=${DELIVERY_ECONOMICS_FOOD_COST_RATE:0}
delivery.economics.packaging-cost=${DELIVERY_ECONOMICS_PACKAGING_COST:0}
delivery.economics.labour-cost=${DELIVERY_ECONOMICS_LABOUR_COST:0}
delivery.economics.waste-cost=${DELIVERY_ECONOMICS_WASTE_COST:0}
delivery.economics.payment-cost-rate=${DELIVERY_ECONOMICS_PAYMENT_COST_RATE:0}
delivery.economics.journey-cost=${DELIVERY_ECONOMICS_JOURNEY_COST:0}
delivery.economics.remedy-cost=${DELIVERY_ECONOMICS_REMEDY_COST:0}
delivery.economics.fee-floor=${DELIVERY_ECONOMICS_FEE_FLOOR:0}
delivery.economics.fee-cap=${DELIVERY_ECONOMICS_FEE_CAP:0}
delivery.economics.minimum-contribution=${DELIVERY_ECONOMICS_MINIMUM_CONTRIBUTION:0}

# SCRUM-32: enable only after SCRUM-31 and rider roster/window capacity review.
gokul.features.delivery-dispatch-pilot=${GOKUL_FEATURES_DELIVERY_DISPATCH_PILOT:false}
