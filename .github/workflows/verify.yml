name: Build and verify

on:
  # Feature branches are verified by the PR event; avoid duplicate push runs.
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CI selection rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Detect frontend inputs
        id: scope
        run: python3 .github/scripts/frontend-changes.py

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Keep Vercel Git deployments disabled
        run: node -e 'for (const path of ["../vercel.json", "./vercel.json"]) if (require(path).git?.deploymentEnabled !== false) process.exit(1)'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Fail on moderate or higher dependency vulnerabilities
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Node regression tests in UTC and a DST browser zone
        run: |
          TZ=UTC node --test tests/*.test.mjs tests/*.test.cjs
          TZ=America/Los_Angeles node --test tests/*.test.mjs tests/*.test.cjs
      - name: Production build with a non-secret HTTPS test API origin
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api-ci.example.invalid
          NEXT_PUBLIC_API_BASE_URL: https://api-ci.example.invalid
          # Synthetic browser settings: every identity API is intercepted by the test.
          NEXT_PUBLIC_MSG91_WIDGET_ID: ci-test-widget
          NEXT_PUBLIC_MSG91_WIDGET_TOKEN: ci-test-widget-token

      - name: Package production build for browser jobs
        run: tar --exclude=.next/cache -czf "$RUNNER_TEMP/gokul-next-build.tgz" .next
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-production-build
          path: ${{ runner.temp }}/gokul-next-build.tgz
          retention-days: 1

  frontend-browser:
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        suite: [navigation, menu, design, single-checkout, account-checkout, staff-bulk]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: frontend-production-build
          path: ${{ runner.temp }}
      - name: Restore tested production build
        run: tar -xzf "$RUNNER_TEMP/gokul-next-build.tgz"
      - name: Install PDF regression tools
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Install browser regression runner
        run: |
          browser_runner="$RUNNER_TEMP/gokul-browser-runner"
          npm install --prefix "$browser_runner" --no-save --package-lock=false playwright@1.56.1
          node "$browser_runner/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$browser_runner/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Browser regressions with per-script timings
        env:
          BROWSER_SUITE: ${{ matrix.suite }}
          SCREENSHOT_DIR: /tmp/gokul-layouts
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3311 > /tmp/gokul-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3311/profile > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/gokul-next.log; exit 1; fi
          mkdir -p "$SCREENSHOT_DIR"
          node ../.github/scripts/run-browser-suite.mjs "$BROWSER_SUITE"
      - name: Upload browser evidence and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.suite }}-evidence
          path: |
            /tmp/gokul-layouts
            /tmp/gokul-next.log
          if-no-files-found: ignore

  # Preserve the required frontend check name, including a successful skip for
  # backend/docs-only changes. Fail closed if detection/build/any shard fails.
  frontend:
    needs: [changes, frontend-build, frontend-browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Frontend verification result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          BUILD_RESULT: ${{ needs.frontend-build.result }}
          BROWSER_RESULT: ${{ needs.frontend-browser.result }}
        run: |
          if [ "$CHANGES_RESULT" != success ]; then exit 1; fi
          if [ "$FRONTEND_CHANGED" = false ]; then
            echo 'Frontend inputs unchanged; build and browser jobs skipped.'
          elif [ "$FRONTEND_CHANGED" = true ] && [ "$BUILD_RESULT" = success ] && [ "$BROWSER_RESULT" = success ]; then
            echo 'Frontend build and all six browser groups passed.'
          else
            echo "Frontend verification failed: build=$BUILD_RESULT browsers=$BROWSER_RESULT"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gokul_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: restaurant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gokul_test -d restaurant_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/restaurant_test
      DATABASE_USERNAME: gokul_test
      DATABASE_PASSWORD: test-only
      R2_ACCOUNT_ID: ci-only
      R2_ACCESS_KEY_ID: ci-only
      R2_SECRET_ACCESS_KEY: ci-only
      PHONEPE_CLIENT_ID: ci-only
      PHONEPE_CLIENT_SECRET: ci-only
      PHONEPE_REDIRECT_URL: https://ci.example.invalid/checkout
      INVENTORY_AUTOMATION_SCHEDULER_ENABLED: 'false'
      GOKUL_REPORTING_AUTOMATIC_REFRESH: 'false'
      GOKUL_ENVIRONMENT_ISOLATION_ENABLED: 'false'
      GOKUL_ENVIRONMENT_CORS_ENABLED: 'false'
      # Test-only 32-byte key so ON-by-default staff sessions can bootstrap in CI.
      STAFF_MFA_ENCRYPTION_KEY: 'Y2ktb25seS1ub3QtZm9yLXByb2R1Y3Rpb24tc2VjcmU='
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify maintenance-only behavior preservation
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/backend-maintainability'
        env:
          MAINTENANCE_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$MAINTENANCE_BASE_REVISION"
          ./gradlew --no-daemon verifyBehaviorPreservation -PmaintenanceBaseRevision="$MAINTENANCE_BASE_REVISION"
      - name: JUnit, enhancement regressions, and build
        run: ./gradlew --no-daemon clean build bootJar
      - name: Show test failure details
        if: failure()
        run: |
          grep -m 1 -A 3 'SchemaManagementException' build/test-results/test/TEST-com.gokulsweets.restaurant.RestaurantBackendApplicationTests.xml || true
          grep -m 1 -A 3 'Caused by: org.flywaydb' build/test-results/test/TEST-com.gokulsweets.restaurant.RestaurantBackendApplicationTests.xml || true
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for failure in case.findall('failure'):
                      print(case.attrib.get('name'), failure.attrib.get('message'), (failure.text or '')[:6000])
          PYTEST

  render-image:
    name: Render Docker build and startup
    needs: render-image-profiles
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both deployment memory profiles
        env:
          PROFILES_RESULT: ${{ needs.render-image-profiles.result }}
        run: test "$PROFILES_RESULT" = success

  render-image-profiles:
    name: Deployment workload (${{ matrix.memory }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - memory: 512m
            cpus: ''
            preview-users: '100'
            java-options: ''
          - memory: 2g
            cpus: '1'
            preview-users: '100,500'
            java-options: '-Xms128m -Xmx768m -XX:+UseG1GC -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=64m -XX:+ExitOnOutOfMemoryError'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gokul_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: restaurant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gokul_test -d restaurant_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/restaurant_test
      DATABASE_USERNAME: gokul_test
      DATABASE_PASSWORD: test-only
      R2_ACCOUNT_ID: ci-only
      R2_ACCESS_KEY_ID: ci-only
      R2_SECRET_ACCESS_KEY: ci-only
      PHONEPE_CLIENT_ID: ci-only
      PHONEPE_CLIENT_SECRET: ci-only
      PHONEPE_REDIRECT_URL: https://ci.example.invalid/checkout
      INVENTORY_AUTOMATION_SCHEDULER_ENABLED: 'true'
      GOKUL_REPORTING_AUTOMATIC_REFRESH: 'true'
      GOKUL_ENVIRONMENT_ISOLATION_ENABLED: 'false'
      GOKUL_ENVIRONMENT_CORS_ENABLED: 'false'
      # Test-only 32-byte key so ON-by-default staff sessions can bootstrap in CI.
      STAFF_MFA_ENCRYPTION_KEY: 'Y2ktb25seS1ub3QtZm9yLXByb2R1Y3Rpb24tc2VjcmU='
      PORT: '10000'
      GOKUL_CI_MEMORY_PROFILE: ${{ matrix.memory }}
      GOKUL_CI_CPU_LIMIT: ${{ matrix.cpus }}
      GOKUL_CI_PREVIEW_USERS: ${{ matrix.preview-users }}
      GOKUL_CI_JAVA_OPTIONS: ${{ matrix.java-options }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete-preview deadline regressions
        run: python3 -B -m unittest discover -s backend/scripts -p 'test_memory_workload.py'
      - name: Build actual deployment image without cached Gradle or Docker layers
        run: docker build --pull --no-cache --progress=plain --tag gokul-render-ci backend
      - name: Start deployment image and verify database-backed health
        run: |
          jvm_args=()
          if [ -n "$GOKUL_CI_JAVA_OPTIONS" ]; then
            jvm_args=(--env "JAVA_TOOL_OPTIONS=$GOKUL_CI_JAVA_OPTIONS")
          fi
          cpu_args=()
          if [ -n "$GOKUL_CI_CPU_LIMIT" ]; then
            cpu_args=(--cpus "$GOKUL_CI_CPU_LIMIT")
          fi
          docker run --detach --name gokul-render-smoke --network host \
            --memory="$GOKUL_CI_MEMORY_PROFILE" "${jvm_args[@]}" "${cpu_args[@]}" \
            --env DATABASE_URL --env DATABASE_USERNAME --env DATABASE_PASSWORD \
            --env R2_ACCOUNT_ID --env R2_ACCESS_KEY_ID --env R2_SECRET_ACCESS_KEY \
            --env PHONEPE_CLIENT_ID --env PHONEPE_CLIENT_SECRET --env PHONEPE_REDIRECT_URL \
            --env INVENTORY_AUTOMATION_SCHEDULER_ENABLED --env GOKUL_REPORTING_AUTOMATIC_REFRESH \
            --env GOKUL_ENVIRONMENT_ISOLATION_ENABLED --env GOKUL_ENVIRONMENT_CORS_ENABLED \
            --env GOKUL_MEMORY_DIAGNOSTICS_ENABLED=true \
            --env STAFF_MFA_ENCRYPTION_KEY --env PORT gokul-render-ci
          for attempt in $(seq 1 120); do
            if [ "$(docker inspect --format '{{.State.Running}}' gokul-render-smoke)" != true ]; then
              echo 'Deployment container exited before becoming healthy'
              exit 1
            fi
            if curl --silent --show-error --fail --max-time 5 http://127.0.0.1:10000/actuator/health > /tmp/gokul-health.json; then
              if python3 -c 'import json; assert json.load(open("/tmp/gokul-health.json"))["status"] == "UP"'; then
                docker exec -i "$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}')" psql -U gokul_test -d restaurant_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO branches(id,code,name) VALUES (10001,'MEMORY_CI','Memory workload');
          INSERT INTO categories(id,code,name) VALUES (10001,'MEMORY_CI','Memory workload');
          INSERT INTO tax_categories(id,code,name,cgst_rate,sgst_rate) VALUES (10001,'MEMORY_CI','Synthetic tax',2.5,2.5);
          INSERT INTO products(code,category_id,name,base_price,tax_category_id)
          SELECT 'MEMORY_CI_'||n,10001,'Menu item '||n,100,10001 FROM generate_series(1,379) n;
          INSERT INTO branch_products(branch_id,product_id)
          SELECT 10001,id FROM products WHERE category_id=10001;
          INSERT INTO branch_inventory_policies(branch_product_id,control_mode,inventory_unit,online_enabled,booking_horizon_days,created_at,updated_at)
          SELECT id,'DAILY_PRODUCTION','PIECE',true,30,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP FROM branch_products WHERE branch_id=10001;
          -- Align fixture service dates with the application's inventory clock, not UTC.
          SET TIME ZONE 'Asia/Kolkata';
          INSERT INTO inventory_daily_allocations(branch_product_id,service_date,status,inventory_unit,approved_quantity,created_at,updated_at)
          SELECT b.id,CURRENT_DATE+n,'APPROVED','PIECE',1000,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP
          FROM branch_products b CROSS JOIN generate_series(1,30) n WHERE b.branch_id=10001;
          INSERT INTO staff_users(id,username,password_hash,full_name,role_id)
          SELECT 10000+n,'memory_ci_'||n,'disabled-ci-only','Memory staff '||n,r.id
          FROM generate_series(1,100) n CROSS JOIN roles r WHERE r.name='KITCHEN_STAFF';
          INSERT INTO staff_branch_access(staff_user_id,branch_id) SELECT id,10001 FROM staff_users WHERE id BETWEEN 10001 AND 10100;
          INSERT INTO staff_sessions(token_hash,staff_id,csrf_hash,staff_updated_at,expires_at)
          SELECT encode(sha256(convert_to('memory_ci_'||lpad((id-10000)::text,33,'0'),'UTF8')),'hex'),id,
          repeat('0',64),updated_at,CURRENT_TIMESTAMP+INTERVAL '1 hour' FROM staff_users WHERE id BETWEEN 10001 AND 10100;
          INSERT INTO pickup_slots(id,branch_id,slot_date,start_time,end_time,capacity)
          VALUES (10001,10001,CURRENT_DATE,'00:00','23:59',1000);
          INSERT INTO pickup_slots(branch_id,slot_date,start_time,end_time,capacity)
          SELECT 10001,CURRENT_DATE+n,'00:00','23:59',1000 FROM generate_series(1,30) n;
          INSERT INTO orders(order_number,branch_id,pickup_slot_id,customer_name,customer_phone,pickup_type,order_status,subtotal,total_amount,reservation_expires_at)
          SELECT 'MEMORY_CI_ORDER_'||n,10001,10001,'Synthetic customer','9999999999','NORMAL','CONFIRMED',500,500,CURRENT_TIMESTAMP+INTERVAL '1 hour' FROM generate_series(1,500) n;
          INSERT INTO order_items(order_id,product_id,product_name,quantity,unit_price,line_total)
          SELECT o.id,p.id,p.name,1,100,100 FROM orders o CROSS JOIN
          (SELECT id,name FROM products WHERE category_id=10001 ORDER BY id LIMIT 5) p WHERE o.branch_id=10001;
          SQL
                echo 'Deployment image started; exercising 379-item menu and scheduled tasks for three minutes'
                for sample in $(seq 1 36); do
                  curl --silent --show-error --fail --max-time 10 'http://127.0.0.1:10000/api/menu?branchId=10001' > /tmp/gokul-menu.json || exit 1
                  docker stats --no-stream --format '{{.MemUsage}} {{.PIDs}}' gokul-render-smoke
                  if [ "$(docker inspect --format '{{.State.Running}}' gokul-render-smoke)" != true ]; then exit 1; fi
                  sleep 5
                done
                python3 backend/scripts/memory-workload.py
                curl --silent --show-error --fail --max-time 10 http://127.0.0.1:10000/actuator/health
                exit 0
              fi
            fi
            sleep 2
          done
          echo 'Deployment image did not become healthy within the startup deadline'
          exit 1
      - name: Deployment container logs
        if: always()
        run: docker logs gokul-render-smoke 2>&1 || true
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force gokul-render-smoke || true
